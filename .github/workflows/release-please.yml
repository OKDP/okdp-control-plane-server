name: release-please

# On every push to main, compute the next semantic version from the
# conventional commits and open/refresh a release PR. Merging that PR
# bumps .release-please-manifest.json and creates the tag + GitHub release.
#
# The publish workflows are chained here instead of listening to the
# release event: GitHub never triggers workflows from events created with
# the default GITHUB_TOKEN, so a release cut by release-please leaves a
# release:published trigger silent (#60).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: write   # upload the GitHub Actions build cache
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}

  publish-chart:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write   # what ghcr needs on forks; quay ignores it
    uses: ./.github/workflows/publish-chart.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
