name: ci

# Pull request and branch CI: vet, test (make test) and govulncheck.

on:
  pull_request:
  push:
    branches: [main, no-kubocd]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.7.0   # v1.8.0 needs Go 1.26; go.mod is on 1.25

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # go.mod replaces github.com/okdp/okdp-lib with ../okdp-lib during the
      # no-kubocd migration.
      - name: Clone okdp-lib next to the repository
        run: git clone --depth 1 https://github.com/OKDP/okdp-lib.git ../okdp-lib
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: make test
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
