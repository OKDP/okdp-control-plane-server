name: build-image

# Build the image and publish it to the OKDP registry on quay.io.
# Called from the release-please workflow with the released version, so
# the semver tag is pushed once per release and never overwritten by
# intermediate commits. Manual runs use the current manifest version.

on:
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_ROBOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the image with (defaults to the manifest version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # The gha build cache (cache-from/cache-to type=gha) uses the runner's
      # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN: no actions: write needed.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # go.mod replaces github.com/okdp/okdp-lib-chart with ../okdp-lib-chart during the
      # no-kubocd migration.
      - name: Clone okdp-lib next to the repository
        run: git clone --depth 1 https://github.com/OKDP/okdp-lib-chart.git ../okdp-lib-chart
      - id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(jq -r '.["."] // "0.1.0"' .release-please-manifest.json)}"
          VERSION="${VERSION#v}"   # the image tag and the binary carry no leading "v"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: okdp-lib=../okdp-lib-chart
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: quay.io/okdp/images/okdp-control-plane-server:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=okdp-control-plane-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
