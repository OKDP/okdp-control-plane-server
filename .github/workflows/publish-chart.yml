name: publish-chart

# Package the Helm chart and publish it to an OCI registry:
# oci://<registry>/<chart-name>. Called from the release-please workflow
# with the released version, so the chart version matches the released
# version.
#
# The registry defaults to the OKDP one. A fork that must not push there sets
# the CHART_REGISTRY repository variable instead of diverging from this file:
# a chart nobody can pull is a package nobody can build.

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish the chart as
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_ROBOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish the chart as (defaults to the manifest version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # packages: write is what ghcr needs. Quay ignores it.
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(jq -r '.["."] // "0.1.0"' .release-please-manifest.json)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
      - name: Package and push chart
        env:
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'quay.io/okdp/charts' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          REGISTRY_HOST="${CHART_REGISTRY%%/*}"
          # Credentials follow the registry, not the presence of a secret: a
          # fork keeps the quay secrets it inherited, and using them against
          # ghcr answers 403.
          if [ "$REGISTRY_HOST" = "ghcr.io" ]; then
            LOGIN_USER="$GH_ACTOR"; LOGIN_TOKEN="$GH_TOKEN"
          else
            LOGIN_USER="$REGISTRY_USERNAME"; LOGIN_TOKEN="$REGISTRY_ROBOT_TOKEN"
          fi
          echo "$LOGIN_TOKEN" | helm registry login "$REGISTRY_HOST" -u "$LOGIN_USER" --password-stdin
          # The chart name comes from Chart.yaml, never hardcoded: renaming the
          # chart would otherwise leave this line pushing a file that no longer
          # exists.
          CHART_NAME=$(helm show chart chart | awk '/^name:/{print $2}')
          helm package chart --version "$VERSION" --app-version "$VERSION"
          helm push "${CHART_NAME}-${VERSION}.tgz" "oci://$CHART_REGISTRY"
