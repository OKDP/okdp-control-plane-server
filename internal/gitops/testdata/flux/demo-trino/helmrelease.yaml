apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: demo-trino
  namespace: okdp-releases
spec:
  interval: 10m
  url: oci://quay.io/okdp/platform-charts/trino
  ref:
    tag: 476-1.0.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-trino
  namespace: okdp-releases
  labels:
    okdp.io/project: demo
    okdp.io/instance: demo-trino
    okdp.io/service: trino
spec:
  interval: 10m
  releaseName: demo-trino
  targetNamespace: demo
  storageNamespace: demo
  chartRef:
    kind: OCIRepository
    name: demo-trino
  valuesFrom:
    - kind: ConfigMap
      name: okdp-platform-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: conn-demo-lake
      valuesKey: values.yaml
    - kind: ConfigMap
      name: conn-demo-warehouse
      valuesKey: values.yaml
    - kind: ConfigMap
      name: values-demo-trino
      valuesKey: values.yaml
