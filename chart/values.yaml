replicaCount: 1

image:
  repository: quay.io/okdp/images/okdp-control-plane-server
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Rendered as environment variables (see internal/config/config.go).
configuration:
  platformNamespace: okdp-system
  kubocdNamespace: kubocd-system
  # The platform Context, read by the server and written for its service
  # catalog. Empty namespace: the namespace the server runs in.
  contextName: platform
  contextNamespace: ""
  # Single origin, set verbatim in the Access-Control-Allow-Origin header.
  allowedOrigins: https://okdp-ui.example.com
  logLevel: info
  releaseInterval: 30m
  releaseTimeout: 10m
  # Comma-separated registry hosts to reach over plain HTTP (dev sandboxes
  # with a local registry). Leave empty in any real deployment.
  insecureOciRegistries: ""

  # The OIDC provider that authenticates API callers. Left empty, the server
  # reads it from the platform Context (identity.oidc, or the older
  # oidc.issuerUri). Set them when the Context publishes neither: without a
  # provider named somewhere, every API request is refused with 401.
  #
  # These must name the same provider and the same client as the console, or
  # tokens the console obtains will be refused.
  oidc:
    authority: ""
    clientId: ""


service:
  type: ClusterIP
  port: 8093

resources: {}

# Forward proxy the pod must go through to reach anything outside the cluster.
# Empty means no proxy, which is the case on any sandbox. Rendered as the three
# environment variables every HTTP client reads.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
