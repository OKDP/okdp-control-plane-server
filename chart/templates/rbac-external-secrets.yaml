# External Secrets Operator: secret stores and external secrets of a project.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-external-secrets-project-view
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-project-view: "true"
    okdp.io/aggregate-to-project-edit: "true"
    okdp.io/aggregate-to-project-admin: "true"
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-external-secrets-project-edit
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-project-edit: "true"
    okdp.io/aggregate-to-project-admin: "true"
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["create", "update", "patch", "delete"]
