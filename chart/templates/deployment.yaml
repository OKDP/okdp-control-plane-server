{{- include "okdp-control-plane-server.validate" . }}
{{- $engine := .Values.engine | default dict }}
{{- $registrySecret := .Values.configuration.registryCredentialsSecret }}
{{- $gitSecret := "" }}
{{- if eq (include "okdp-control-plane-server.persistenceMode" .) "git" }}
{{- $gitSecret = dig "kubocd" "persistence" "git" "secretName" "" $engine }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "okdp-control-plane-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Environment variables only refresh on pod restart: roll the
        # Deployment whenever the ConfigMap content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "okdp-control-plane-server.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "okdp-control-plane-server.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "okdp-control-plane-server.fullname" . }}
          {{- with .Values.proxy }}
          {{- if or .httpProxy .httpsProxy .noProxy }}
          env:
            {{- if .httpProxy }}
            - { name: HTTP_PROXY,  value: {{ .httpProxy | quote }} }
            - { name: http_proxy,  value: {{ .httpProxy | quote }} }
            {{- end }}
            {{- if .httpsProxy }}
            - { name: HTTPS_PROXY, value: {{ .httpsProxy | quote }} }
            - { name: https_proxy, value: {{ .httpsProxy | quote }} }
            {{- end }}
            {{- if .noProxy }}
            - { name: NO_PROXY,    value: {{ .noProxy | quote }} }
            - { name: no_proxy,    value: {{ .noProxy | quote }} }
            {{- end }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $registrySecret }}
            - name: registry-credentials
              mountPath: /etc/okdp/registry
              readOnly: true
            {{- end }}
            {{- if $gitSecret }}
            # The whole Secret, never a subPath: the kubelet updates a rotated
            # Secret in place and the server reads it on every fetch and push.
            - name: git-credentials
              mountPath: /etc/okdp/git
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | default "256Mi" }}
        {{- if $registrySecret }}
        - name: registry-credentials
          secret:
            secretName: {{ $registrySecret | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if $gitSecret }}
        - name: git-credentials
          secret:
            secretName: {{ $gitSecret | quote }}
            defaultMode: 0440
        {{- end }}
