# The server reaches the cluster through its ServiceAccount (in-cluster
# config). A ClusterRole is required because project namespaces are created
# dynamically and are not known ahead of time.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
rules:
  # Projects are projects/<p>/project.yaml in Git. The server creates the
  # namespace of a project it creates (label okdp.io/project) and deletes only
  # namespaces carrying that label.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  # Secrets (SecretStore and connection credentials), pods + logs (service inspection)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Warning events explain an instance that is not Ready; per-user volumes
  # (JupyterHub homes) are reclaimed when their instance is deleted.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # Observed state, read-only. ConfigMaps: the instance descriptors
  # (<release>-okdp, label okdp.io/instance) in the project namespaces, and the
  # platform values (okdp-platform-values) in the releases namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # The SparkApplication form reads the operator's CRD schema.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Resource usage panels — metrics-server
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Identity management (kubauth CRDs)
  - apiGroups: ["kubauth.kubotal.io"]
    resources: ["users", "groups", "groupbindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["kubauth.kubotal.io"]
    resources: ["oidcclients"]
    # delete: a service being removed takes its OIDC client with it
    # (service_service.go, DeleteService)
    verbs: ["get", "list", "delete"]
  # Secret management (External Secrets Operator)
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Spark workloads
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # GitOps engine objects, read-only: the render/sync status of each release.
  # The server never writes them, the engine makes them from Git.
  {{- if eq .Values.gitops.engine "argocd" }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  {{- else }}
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "okdp-control-plane-server.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "okdp-control-plane-server.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
