# OKDP roles. Each one is aggregated from the ClusterRoles carrying its
# okdp.io/aggregate-to-* label: this file only holds the core Kubernetes rules,
# and the rbac-<tool>.yaml files add the rules of the tools the server drives.
#
# The server acts for itself only to read the platform, list projects and
# clean up OIDC clients (okdp-control-plane). Everything a console user asks
# for is sent to the API server as that user, through impersonation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-control-plane: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "okdp-control-plane-server.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "okdp-control-plane-server.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-control-plane
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-control-plane: "true"
rules:
  # Users and groups are not restricted by name: the server prefixes every
  # name taken from a token with "oidc:", so none can be a system: name.
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  # Projects are listed, then filtered by what the caller can read.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Credentials of the OIDC client provisioner.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# Roles given to console users. A project role is granted by a RoleBinding in
# the project namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-project-view
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-project-view: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-project-edit
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-project-edit: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-project-admin
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-project-admin: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-platform-admin
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-platform-admin: "true"
rules: []
---
# What any console user reads outside a project. okdp:users is added by the
# server to every caller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-user
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        okdp.io/aggregate-to-user: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: okdp-user
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: okdp:users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: okdp-user
  apiGroup: rbac.authorization.k8s.io
{{- with .Values.rbac.platformAdminGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: okdp-platform-admin
  labels:
    {{- include "okdp-control-plane-server.labels" $ | nindent 4 }}
subjects:
  {{- range . }}
  - kind: Group
    name: oidc:{{ . }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
roleRef:
  kind: ClusterRole
  name: okdp-platform-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-project-view
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-project-view: "true"
    okdp.io/aggregate-to-project-edit: "true"
    okdp.io/aggregate-to-project-admin: "true"
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  # A RoleBinding in the namespace grants get on the namespace itself.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-project-edit
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-project-edit: "true"
    okdp.io/aggregate-to-project-admin: "true"
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  # Connection and secret store credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Per-user pods and volumes a deleted service leaves behind.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-project-admin
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-project-admin: "true"
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  # Edit the project description, delete the project.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdp-aggregate-to-platform-admin
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
    okdp.io/aggregate-to-platform-admin: "true"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch", "create"]
