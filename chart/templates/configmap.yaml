apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  PLATFORM_NAMESPACE: {{ .Values.configuration.platformNamespace | quote }}
  KUBOCD_NAMESPACE: {{ .Values.configuration.kubocdNamespace | quote }}
  CONTEXT_NAME: {{ .Values.configuration.contextName | quote }}
  CONTEXT_NAMESPACE: {{ .Values.configuration.contextNamespace | quote }}
  ALLOWED_ORIGINS: {{ .Values.configuration.allowedOrigins | quote }}
  LOG_LEVEL: {{ .Values.configuration.logLevel | quote }}
  RELEASE_INTERVAL: {{ .Values.configuration.releaseInterval | quote }}
  RELEASE_TIMEOUT: {{ .Values.configuration.releaseTimeout | quote }}
  # The provider that authenticates API callers, and the client its tokens must
  # be issued for. Read from the platform Context first; these apply to a
  # Context that publishes neither, and carry the same names as the console's
  # own variables because the two must name one provider.
  {{- if .Values.configuration.oidc.authority }}
  OIDC_AUTHORITY: {{ .Values.configuration.oidc.authority | quote }}
  {{- end }}
  {{- if .Values.configuration.oidc.clientId }}
  OIDC_CLIENT_ID: {{ .Values.configuration.oidc.clientId | quote }}
  {{- end }}
  {{- if .Values.configuration.insecureOciRegistries }}
  # Development sandboxes only: registry hosts reached over plain HTTP.
  INSECURE_OCI_REGISTRIES: {{ .Values.configuration.insecureOciRegistries | quote }}
  {{- end }}
